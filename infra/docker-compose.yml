services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leather_manager}
      POSTGRES_USER: ${POSTGRES_USER:-leather_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leather_manager}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
